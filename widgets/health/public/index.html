<html>

<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    #wrap { width: 100%; height: 100%; display: flex; flex-direction: column; padding: var(--homey-su-4, 16px); gap: var(--homey-su-2, 8px); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-y: auto; }
    .hidden { display: none; }
    #head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #title { font-size: 15px; font-weight: 600; color: var(--homey-text-color, #16161a); }
    #hint, .loading { font-size: 13px; color: var(--homey-text-color-light, #7a7a85); }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0; background-color: var(--homey-line-color-light, #f2f2f4); color: var(--homey-text-color-light, #7a7a85); }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background-color: var(--homey-line-color, #cfcfd4); }
    .pill.is-good { background-color: var(--homey-background-color-green, #d9f2e3); color: var(--homey-text-color-green, #1e8e5a); }
    .pill.is-good .dot { background-color: var(--homey-icon-color-green, #1e8e5a); }
    .pill.is-warn { background-color: #fff3dc; color: #a15c00; }
    .pill.is-warn .dot { background-color: #e0921a; }
    .pill.is-bad { background-color: var(--homey-background-color-red, #f9d9d9); color: var(--homey-text-color-red, #b42318); }
    .pill.is-bad .dot { background-color: var(--homey-icon-color-red, #b42318); }
    .row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--homey-line-color-light, #f2f2f4); }
    #rows .row:last-child { border-bottom: none; }
    .light { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; background-color: var(--homey-line-color, #cfcfd4); }
    .light.is-good { background-color: var(--homey-icon-color-green, #1e8e5a); }
    .light.is-warn { background-color: #e0921a; }
    .light.is-bad { background-color: var(--homey-icon-color-red, #b42318); }
    .light.is-info { background-color: var(--homey-color-blue, #2c7be5); }
    .body { flex: 1 1 auto; min-width: 0; }
    .label { font-size: 12px; color: var(--homey-text-color-light, #7a7a85); }
    .text { font-size: 14px; font-weight: 600; color: var(--homey-text-color, #16161a); }
    .names { font-size: 11px; color: var(--homey-text-color-light, #7a7a85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #wrap.stale { opacity: 0.5; transition: opacity 0.3s; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="head"><div id="title" class="hidden"></div><div id="overall" class="pill hidden"></div></div>
    <div id="hint" class="hidden">Nothing to show yet. Add a monitor or a watchdog in Sentinels settings; the availability scan starts a couple of minutes after the app does.</div>
    <div id="rows"><div class="loading">Loading...</div></div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var $wrap = document.getElementById('wrap');
      var $title = document.getElementById('title');
      var $overall = document.getElementById('overall');
      var $hint = document.getElementById('hint');
      var $rows = document.getElementById('rows');
      var hasLoadedOnce = false;
      var settings = {};
      try { settings = Homey.getSettings() || {}; } catch (e) { settings = {}; }

      function applyTitle() {
        var text = settings.title ? String(settings.title) : '';
        $title.textContent = text;
        $title.classList.toggle('hidden', !text);
      }

      function renderRow(row) {
        var el = document.createElement('div');
        el.className = 'row';
        var light = document.createElement('div');
        light.className = 'light is-' + row.level;
        var body = document.createElement('div');
        body.className = 'body';
        var label = document.createElement('div');
        label.className = 'label';
        label.textContent = row.label;
        var text = document.createElement('div');
        text.className = 'text';
        text.textContent = row.text;
        body.appendChild(label);
        body.appendChild(text);
        if (row.names && row.names.length) {
          var names = document.createElement('div');
          names.className = 'names';
          names.textContent = row.names.join(', ') + (row.more ? ' +' + row.more + ' more' : '');
          body.appendChild(names);
        }
        el.appendChild(light);
        el.appendChild(body);
        return el;
      }

      function render(summary) {
        $rows.innerHTML = '';
        if (!summary.rows.length) {
          $overall.classList.add('hidden');
          $hint.classList.remove('hidden');
          return;
        }
        $hint.classList.add('hidden');
        $overall.className = 'pill is-' + summary.level;
        $overall.innerHTML = '<span class="dot"></span><span></span>';
        $overall.querySelector('span:last-child').textContent = summary.attentionCount ? summary.attentionCount + ' need' + (summary.attentionCount === 1 ? 's' : '') + ' attention' : 'All good';
        summary.rows.forEach(function (row) { $rows.appendChild(renderRow(row)); });
      }

      async function load() {
        if (document.hidden) return; // no polling while the widget is not on screen
        try {
          var summary = await Homey.api('GET', '/summary');
          hasLoadedOnce = true;
          $wrap.classList.remove('stale');
          render(summary);
        } catch (error) {
          if (hasLoadedOnce) $wrap.classList.add('stale');
        }
      }

      Homey.on('settings.set', function (key, value) { settings[key] = value; applyTitle(); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
      applyTitle();
      load().finally(function () { Homey.ready(); });
      setInterval(load, 30000);
    }
  </script>
</body>

</html>
