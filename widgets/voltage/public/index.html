<html>

<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    #wrap { width: 100%; height: 100%; display: flex; flex-direction: column; padding: var(--homey-su-4, 16px); gap: var(--homey-su-2, 8px); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-y: auto; }
    .hidden { display: none; }
    #head { display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
    #title { font-size: 15px; font-weight: 600; color: var(--homey-text-color, #16161a); }
    #hint, .loading { font-size: 13px; color: var(--homey-text-color-light, #7a7a85); }
    .row { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--homey-line-color-light, #f2f2f4); }
    #rows .row:last-child { border-bottom: none; }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .name { font-size: 13px; font-weight: 600; color: var(--homey-text-color, #16161a); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
    .meta { font-size: 11px; color: var(--homey-text-color-light, #7a7a85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0; background-color: var(--homey-line-color-light, #f2f2f4); color: var(--homey-text-color-light, #7a7a85); }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background-color: var(--homey-line-color, #cfcfd4); }
    .pill.is-good { background-color: var(--homey-background-color-green, #d9f2e3); color: var(--homey-text-color-green, #1e8e5a); }
    .pill.is-good .dot { background-color: var(--homey-icon-color-green, #1e8e5a); }
    .pill.is-bad { background-color: var(--homey-background-color-red, #f9d9d9); color: var(--homey-text-color-red, #b42318); }
    .pill.is-bad .dot { background-color: var(--homey-icon-color-red, #b42318); }
    #wrap.stale { opacity: 0.5; transition: opacity 0.3s; }
    .big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--homey-text-color, #16161a); }
    .bar { position: relative; height: 6px; border-radius: 3px; background-color: var(--homey-line-color-light, #f2f2f4); margin: 2px 0; }
    .bar .band { position: absolute; top: 0; bottom: 0; border-radius: 3px; background-color: var(--homey-background-color-green, #d9f2e3); }
    .bar .marker { position: absolute; top: -3px; width: 4px; height: 12px; border-radius: 2px; margin-left: -2px; background-color: var(--homey-icon-color-green, #1e8e5a); }
    .bar .marker.is-bad { background-color: var(--homey-icon-color-red, #b42318); }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="head"><div id="summary" class="pill hidden"></div></div>
    <div id="hint" class="hidden">No voltage monitors yet. Add one in Sentinels settings, under Monitors, Voltage.</div>
    <div id="rows"><div class="loading">Loading...</div></div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var $wrap = document.getElementById('wrap');
      var $summary = document.getElementById('summary');
      var $hint = document.getElementById('hint');
      var $rows = document.getElementById('rows');
      var hasLoadedOnce = false;

      function fmt(value) { return value === null || value === undefined ? '-' : Number(value).toFixed(1); }

      function pill(text, cls) {
        var el = document.createElement('div');
        el.className = 'pill' + (cls ? ' ' + cls : '');
        el.innerHTML = '<span class="dot"></span><span></span>';
        el.querySelector('span:last-child').textContent = text;
        return el;
      }

      // Where the reading sits inside the configured band, on a scale that shows a little room either side.
      function bar(item, abnormal) {
        if (item.bandMin === null || item.bandMax === null || item.currentVoltage === null) return null;
        var pad = (item.bandMax - item.bandMin) * 0.25;
        var lo = item.bandMin - pad;
        var span = (item.bandMax + pad) - lo;
        var pct = function (v) { return Math.max(0, Math.min(100, ((v - lo) / span) * 100)); };
        var track = document.createElement('div');
        track.className = 'bar';
        var band = document.createElement('div');
        band.className = 'band';
        band.style.left = pct(item.bandMin) + '%';
        band.style.width = (pct(item.bandMax) - pct(item.bandMin)) + '%';
        var marker = document.createElement('div');
        marker.className = 'marker' + (abnormal ? ' is-bad' : '');
        marker.style.left = pct(item.currentVoltage) + '%';
        track.appendChild(band);
        track.appendChild(marker);
        return track;
      }

      function renderRow(item) {
        var abnormal = item.state && item.state !== 'NORMAL';
        var row = document.createElement('div');
        row.className = 'row';
        var line = document.createElement('div');
        line.className = 'line';
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = item.name;
        var big = document.createElement('div');
        big.className = 'big';
        big.textContent = item.currentVoltage === null ? '-' : fmt(item.currentVoltage) + ' V';
        line.appendChild(name);
        line.appendChild(big);
        row.appendChild(line);
        var track = bar(item, abnormal);
        if (track) row.appendChild(track);
        var meta = document.createElement('div');
        meta.className = 'line';
        var text = document.createElement('div');
        text.className = 'meta';
        var episodes = item.undervoltageCount + item.overvoltageCount;
        var noReading = item.currentVoltage === null;
        text.textContent = noReading ? 'no reading yet' : 'today ' + fmt(item.todayMin) + ' - ' + fmt(item.todayMax) + ' V - ' + episodes + ' episode' + (episodes === 1 ? '' : 's');
        meta.appendChild(text);
        meta.appendChild(noReading ? pill('No data', '') : pill(item.state === 'UNDERVOLTAGE' ? 'Undervoltage' : item.state === 'OVERVOLTAGE' ? 'Overvoltage' : 'Normal', abnormal ? 'is-bad' : 'is-good'));
        row.appendChild(meta);
        return row;
      }

      async function load() {
        if (document.hidden) return;
        try {
          var summary = await Homey.api('GET', '/summary');
          hasLoadedOnce = true;
          $wrap.classList.remove('stale');
          $rows.innerHTML = '';
          if (!summary.total) {
            $summary.classList.add('hidden');
            $hint.classList.remove('hidden');
            return;
          }
          $hint.classList.add('hidden');
          $summary.className = 'pill ' + (summary.abnormalCount ? 'is-bad' : 'is-good');
          $summary.innerHTML = '<span class="dot"></span><span></span>';
          $summary.querySelector('span:last-child').textContent = summary.abnormalCount ? summary.abnormalCount + ' abnormal' : 'All normal';
          summary.items.forEach(function (item) { $rows.appendChild(renderRow(item)); });
        } catch (error) {
          if (hasLoadedOnce) $wrap.classList.add('stale');
        }
      }

      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
      load().finally(function () { Homey.ready(); });
      setInterval(load, 30000);
    }
  </script>
</body>

</html>
