<html>

<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--homey-su-4, 16px);
      gap: var(--homey-su-2, 8px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-y: auto;
    }
    #hint, .row-loading { font-size: 13px; color: var(--homey-text-color-light, #7a7a85); }
    .hidden { display: none; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--homey-line-color-light, #f2f2f4); }
    #rows .row:last-child { border-bottom: none; }
    .row-name { font-size: 13px; font-weight: 600; color: var(--homey-text-color, #16161a); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
    .row-status {
      display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0;
      background-color: var(--homey-line-color-light, #f2f2f4); color: var(--homey-text-color-light, #7a7a85);
    }
    .row-status .dot { width: 7px; height: 7px; border-radius: 50%; background-color: var(--homey-line-color, #cfcfd4); }
    .row-status.is-good { background-color: var(--homey-background-color-green, #d9f2e3); color: var(--homey-text-color-green, #1e8e5a); }
    .row-status.is-good .dot { background-color: var(--homey-icon-color-green, #1e8e5a); }
    .row-status.is-bad { background-color: var(--homey-background-color-red, #f9d9d9); color: var(--homey-text-color-red, #b42318); }
    .row-status.is-bad .dot { background-color: var(--homey-icon-color-red, #b42318); }
    #wrap.stale { opacity: 0.5; transition: opacity 0.3s; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="hint" class="hidden">Configure up to 5 items in the widget settings.</div>
    <div id="rows"><div class="row-loading">Loading…</div></div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var $wrap = document.getElementById('wrap');
      var $hint = document.getElementById('hint');
      var $rows = document.getElementById('rows');
      var hasLoadedOnce = false;

      // Same {name, data:{id}} vs plain-id unwrap the sentinel widget's own settings need —
      // Homey sometimes stores the autocomplete's full selection object, not just the id.
      function unwrapId(raw) {
        if (!raw) return null;
        return typeof raw === 'object' ? (raw.data ? raw.data.id : raw.id) : raw;
      }

      function configuredIds() {
        var settings = Homey.getSettings();
        return ['monitor1', 'monitor2', 'monitor3', 'monitor4', 'monitor5']
          .map(function (key) { return unwrapId(settings[key]); })
          .filter(Boolean);
      }

      // One condensed line per kind — the full stat breakdown belongs to the single-monitor
      // "Sentinel" widget; this one trades detail for fitting several items in one glance.
      function shortStatus(summary) {
        if (!summary) return { text: 'Unavailable', cls: '' };
        if (summary.kind === 'activity') {
          if (summary.calibrating) return { text: 'Calibrating', cls: '' };
          var isActive = summary.state === 'ACTIVE';
          return { text: isActive ? 'Active' : 'Standby', cls: isActive ? 'is-good' : '' };
        }
        if (summary.kind === 'state') {
          var isOn = summary.state === 'ACTIVE';
          return { text: isOn ? summary.trueLabel : summary.falseLabel, cls: isOn ? 'is-good' : '' };
        }
        if (summary.kind === 'voltage') {
          var isNormal = summary.state === 'NORMAL';
          var voltageText = summary.currentVoltage !== null && summary.currentVoltage !== undefined ? Number(summary.currentVoltage).toFixed(1) + ' V' : '—';
          if (isNormal) return { text: voltageText, cls: 'is-good' };
          return { text: summary.state === 'UNDERVOLTAGE' ? 'Undervoltage' : 'Overvoltage', cls: 'is-bad' };
        }
        if (summary.kind === 'group') {
          var allMatch = summary.mismatchCount === 0;
          return { text: allMatch ? 'All match' : summary.mismatchCount + ' mismatch' + (summary.mismatchCount === 1 ? '' : 'es'), cls: allMatch ? 'is-good' : 'is-bad' };
        }
        if (summary.kind === 'binary') {
          return { text: (summary.eventCount || 0) + ' today', cls: '' };
        }
        return { text: '—', cls: '' };
      }

      function renderRow(summary) {
        var row = document.createElement('div');
        row.className = 'row';
        var name = document.createElement('div');
        name.className = 'row-name';
        name.textContent = summary ? summary.name : '—';
        var status = shortStatus(summary);
        var badge = document.createElement('div');
        badge.className = 'row-status' + (status.cls ? ' ' + status.cls : '');
        badge.innerHTML = '<span class="dot"></span><span></span>';
        badge.querySelector('span:last-child').textContent = status.text;
        row.appendChild(name);
        row.appendChild(badge);
        return row;
      }

      async function load() {
        var ids = configuredIds();
        if (!ids.length) {
          $hint.classList.remove('hidden');
          $rows.classList.add('hidden');
          return;
        }
        try {
          var summaries = await Promise.all(ids.map(function (id) {
            return Homey.api('GET', '/summary?id=' + encodeURIComponent(id) + '&period=day').catch(function () { return null; });
          }));
          hasLoadedOnce = true;
          $wrap.classList.remove('stale');
          $hint.classList.add('hidden');
          $rows.classList.remove('hidden');
          $rows.innerHTML = '';
          summaries.forEach(function (summary) { $rows.appendChild(renderRow(summary)); });
        } catch (error) {
          if (hasLoadedOnce) $wrap.classList.add('stale');
        }
      }

      Homey.on('settings.set', load);
      load().finally(function () { Homey.ready(); });
      setInterval(load, 30000);
    }
  </script>
</body>

</html>
